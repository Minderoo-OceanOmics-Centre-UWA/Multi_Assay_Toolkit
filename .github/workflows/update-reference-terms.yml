# Every 3 months, refresh the local copies of the Darwin Core / GBIF / FAIRe
# definitions in reference/ (scripts/update_reference_terms.R). If anything
# changed, the new files go to the branch "auto/reference-terms" and an issue
# is opened describing the changes, with a link to open a pull request - so a
# person reviews everything before it reaches main (and the live app).
#
# Opens an issue rather than a pull request because the organisation doesn't
# allow GitHub Actions to create pull requests.
# Can also be run by hand: GitHub > Actions > "Check Darwin Core / GBIF references" > Run workflow.

name: Check Darwin Core / GBIF references

on:
  schedule:
    - cron: "0 0 1 1,4,7,10 *"   # 1 Jan, Apr, Jul, Oct (00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: auto/reference-terms
      ISSUE_TITLE: "Darwin Core / GBIF / FAIRe definitions have changed - please review"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("xml2", "jsonlite", "readxl"))'

      - name: Refresh reference files
        run: Rscript scripts/update_reference_terms.R "$RUNNER_TEMP/reference_summary.md"

      - name: Push changes to a branch and open an issue
        run: |
          if git diff --quiet -- reference/ && [ -z "$(git ls-files --others --exclude-standard reference/)" ]; then
            echo "CHANGED=false" >> "$GITHUB_ENV"
            echo "No changes - the reference files are up to date."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add reference/
          git commit -m "Update Darwin Core / GBIF / FAIRe reference files"
          git push --force origin "$BRANCH"

          DEFAULT="${{ github.event.repository.default_branch }}"
          PR_LINK="${{ github.server_url }}/${{ github.repository }}/compare/${DEFAULT}...${BRANCH}?expand=1"
          {
            cat "$RUNNER_TEMP/reference_summary.md"
            echo
            echo "---"
            echo "**To apply:** review the file changes, then [open a pull request](${PR_LINK}) from \`${BRANCH}\` and merge it."
            echo "After merging, deploy as usual (\`git pull\` on the server). Close this issue when done."
          } > "$RUNNER_TEMP/issue_body.md"

          # One open issue at a time: add a comment if it's still open from last time.
          EXISTING=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/issue_body.md"
            ISSUE_URL="${{ github.server_url }}/${{ github.repository }}/issues/${EXISTING}"
          else
            ISSUE_URL=$(gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue_body.md")
          fi
          echo "ISSUE_URL=$ISSUE_URL" >> "$GITHUB_ENV"
          echo "PR_LINK=$PR_LINK" >> "$GITHUB_ENV"
          echo "CHANGED=true" >> "$GITHUB_ENV"

      # An issue opened by a workflow can't start another workflow, so this
      # job sends its own email (same template as notify-pull-requests.yml).
      - name: Email Anushka (cc Emma)
        if: env.CHANGED == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NOTIFY_CC: ${{ secrets.NOTIFY_CC }}
          MAIL_SUBJECT: "MAT: Darwin Core / GBIF / FAIRe definitions have changed - please review"
          MAIL_HEADLINE: "Quarterly reference check found changes"
          MAIL_INTRO: "The quarterly check of the Darwin Core, GBIF and FAIRe definitions found changes. The updated reference files are on the branch `auto/reference-terms`. Please review them and open a pull request if they look right - nothing changes on the live app until it is merged and deployed."
        run: |
          export MAIL_BODY_FILE="$RUNNER_TEMP/reference_summary.md"
          export MAIL_FACTS="$(printf 'Issue: [%s](%s)\nOpen the pull request: [compare and merge](%s)' "$ISSUE_URL" "$ISSUE_URL" "$PR_LINK")"
          export MAIL_LINK_URL="$ISSUE_URL"
          export MAIL_LINK_LABEL="Open the issue on GitHub"
          python3 .github/scripts/send_notification.py
