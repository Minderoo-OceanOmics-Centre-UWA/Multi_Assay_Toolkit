# Every 3 months, refresh the local copies of the Darwin Core / GBIF definitions
# in reference/ (scripts/update_reference_terms.R). If anything changed, open a
# pull request describing it, so a person reviews it before it reaches the app.
# Can also be run by hand: GitHub > Actions > "Check Darwin Core / GBIF references" > Run workflow.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".

name: Check Darwin Core / GBIF references

on:
  schedule:
    - cron: "0 0 1 1,4,7,10 *"   # 1 Jan, Apr, Jul, Oct (00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("xml2", "jsonlite", "readxl"))'

      - name: Refresh reference files
        run: Rscript scripts/update_reference_terms.R "$RUNNER_TEMP/reference_summary.md"

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/reference-terms
          delete-branch: true
          add-paths: reference/*
          commit-message: "Update Darwin Core / GBIF reference files"
          title: "Darwin Core / GBIF definitions have changed - please review"
          body-path: ${{ runner.temp }}/reference_summary.md
