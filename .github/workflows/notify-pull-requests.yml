# Every hour, email Anushka (cc Emma) once about each open pull request that
# needs review (.github/scripts/notify_open_prs.py). Emailed pull requests get
# the label "review-email-sent" so they're never emailed twice; drafts wait
# until they're marked ready. Uses the app's own Gmail account.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   SMTP_USER, SMTP_PASSWORD   the app's Gmail account + app password (.Renviron)
#   NOTIFY_TO, NOTIFY_CC       recipient addresses (kept out of this public repo)
#
# A schedule instead of pull_request_target: GitHub restricts that trigger on
# public repositories from 2 December 2026. This job never runs any pull
# request's code - it only reads the pull request list.

name: Email when a pull request needs review

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # to add the "review-email-sent" label
  issues: write          # to create that label the first time

concurrency:
  group: notify-pull-requests
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Email about new pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NOTIFY_CC: ${{ secrets.NOTIFY_CC }}
        run: python3 .github/scripts/notify_open_prs.py
